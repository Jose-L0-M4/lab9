
name: Basic Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test valid data
        run: |
          output=$(printf "0871234567\nJose\n" | python3 validate-data.py)
          echo "$output"
          echo "$output" | grep -q "Pass"

      - name: Test long name
        run: |
          output=$(printf "0871234567\nThisNameIsMuchTooLong\n" | python3 validate-data.py)
          echo "$output"
          echo "$output" | grep -q "Fail"

      - name: Test long phone number
        run: |
          output=$(printf "087123456789\nJose\n" | python3 validate-data.py)
          echo "$output"
          echo "$output" | grep -q "Fail"
